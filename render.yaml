services:
  # 1. Backend FastAPI Service
  - type: web
    name: cirs-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 8000
    rootDirectory: backend
    envVars:
      - key: MONGO_URI
        sync: false # Set manually in Render dashboard
      - key: DATABASE_NAME
        value: cirs_db
      - key: SECRET_KEY
        generateValue: true # Render will generate a safe key
      - key: ALGORITHM
        value: HS256
      - key: APP_ENV
        value: production

  # 2. Frontend React (Vite) Site
  - type: static
    name: cirs-frontend
    env: static
    buildCommand: npm install && npm run build
    publishPath: ./dist
    rootDirectory: frontend
    envVars:
      - key: VITE_API_URL
        fromService:
          name: cirs-backend
          type: web
          property: url
